# Hasta ahora Netlify publicaba el repo tal cual, sin build command. Con
# Eleventy (ver SPEC.md sección 4) hace falta correr el build y publicar
# _site/ en vez de la raíz — _headers/_redirects/assets/productos se
# pasan a _site/ como passthrough copy (ver eleventy.config.js), así que
# la CSP y los redirects siguen funcionando igual desde ahí.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"
